[package]
name = "canforge"
version = "0.1.0"
edition = "2024"
description = "Simple OBD-II car diagnostics built on GPUI, gpui-kit and candriver."
license = "Apache-2.0"

[dependencies]
gpui-kit = "0.7.1"
candriver-core = { path = "../candriver/crates/candriver-core" }
candriver-op20 = { path = "../candriver/crates/candriver-op20" }
candriver-obd = { path = "../candriver/crates/candriver-obd" }
candriver-uds = { path = "../candriver/crates/candriver-uds" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sha2 = "0.10"
# photos on the report are re-encoded as JPEG; the same crate GPUI already uses to read images
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Hot patching of the running app (scripts/hot.sh). Only built with `--features hot`.
subsecond = { version = "0.7", optional = true }
dioxus-devtools = { version = "0.7", optional = true }

[features]
hot = ["dep:subsecond", "dep:dioxus-devtools"]

# GPUI and its dependencies (wgpu, text shaping, …) are far too slow unoptimised, which shows up as
# laggy scrolling and redraws. Optimise dependencies even in dev builds; the app's own code stays
# quick to rebuild.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
debug = "line-tables-only"
